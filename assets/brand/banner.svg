<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Malfoy QQ Bot">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2c1f"/>
      <stop offset=".5" stop-color="#081a12"/>
      <stop offset="1" stop-color="#040c08"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="78%" cy="50%" r="42%">
      <stop offset="0" stop-color="#2f6b4e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#081a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset=".5" stop-color="#c2cbca"/>
      <stop offset="1" stop-color="#7d8c8d"/>
    </linearGradient>
    <linearGradient id="b-hair" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#f5f1e7"/>
      <stop offset=".55" stop-color="#ded7c8"/>
      <stop offset="1" stop-color="#b3a999"/>
    </linearGradient>
    <linearGradient id="b-hairShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ded7c8"/>
      <stop offset="1" stop-color="#a99f8f"/>
    </linearGradient>
    <linearGradient id="b-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faece6"/>
      <stop offset="1" stop-color="#e9cec5"/>
    </linearGradient>
    <linearGradient id="b-dress" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#1b5a3e"/>
      <stop offset=".55" stop-color="#0d3527"/>
      <stop offset="1" stop-color="#061a12"/>
    </linearGradient>
    <clipPath id="b-clip">
      <circle cx="1030" cy="200" r="168"/>
    </clipPath>
  </defs>

  <rect width="1280" height="400" fill="url(#b-bg)"/>
  <rect width="1280" height="400" fill="url(#b-glow)"/>

  <!-- fine constellation lines -->
  <g stroke="#9fb6ad" stroke-opacity=".16" fill="none">
    <path d="M60 340 L180 300 L270 322 L360 270"/>
    <path d="M1090 66 L1150 44 L1210 70"/>
    <path d="M40 90 L120 62 L190 84"/>
  </g>
  <g fill="#e9e4d8">
    <circle cx="180" cy="300" r="2.2" opacity=".55"/>
    <circle cx="270" cy="322" r="1.8" opacity=".45"/>
    <circle cx="360" cy="270" r="2" opacity=".5"/>
    <circle cx="1150" cy="44" r="2" opacity=".5"/>
    <circle cx="120" cy="62" r="1.8" opacity=".45"/>
  </g>

  <!-- left copy -->
  <g>
    <text x="76" y="92" fill="#8fb3a1" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="5">QQ · RESEARCH · ASSISTANT</text>
    <text x="72" y="176" fill="url(#b-silver)" font-family="Georgia, 'Times New Roman', serif" font-size="70">Malfoy QQ Bot</text>
    <text x="76" y="216" fill="#c9d4ce" font-family="Georgia, 'Times New Roman', serif" font-size="24">NapCat + Koishi + ChatLuna</text>
    <text x="76" y="254" fill="#e4ebe6" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="23" letter-spacing="1">会读论文的斯莱特林大小姐</text>

    <g font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#dbe6df">
      <rect x="76" y="286" width="178" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="94" y="308">arXiv 日报 / 周报</text>
      <rect x="266" y="286" width="164" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="284" y="308">Research Agent</text>
      <rect x="442" y="286" width="112" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="460" y="308">Edge TTS</text>
      <rect x="566" y="286" width="124" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="584" y="308">MIT License</text>
    </g>

    <text x="76" y="366" fill="#7f978d" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing=".5">github.com/ABLingss/malfoy-QQ-bot</text>
  </g>

  <!-- right medallion -->
  <g>
    <circle cx="1030" cy="200" r="182" fill="none" stroke="#9fb6ad" stroke-opacity=".2" stroke-dasharray="3 9"/>
    <g clip-path="url(#b-clip)">
      <rect x="862" y="32" width="336" height="336" fill="#0a1f16"/>
      <ellipse cx="1030" cy="190" rx="190" ry="180" fill="#2f6b4e" opacity=".22"/>
      <g transform="translate(831.6 -48) scale(.62)">
        <!-- hair back -->
        <path d="M196 420 C186 300 236 214 320 214 C404 214 454 300 444 420
                 C452 520 472 600 490 670 C456 694 420 688 404 664
                 L388 560 L382 672 C350 690 290 690 258 672 L252 560 L236 664
                 C220 688 184 694 150 670 C168 600 188 520 196 420 Z"
              fill="url(#b-hairShade)"/>
        <!-- ears -->
        <ellipse cx="242" cy="268" rx="43" ry="45" fill="url(#b-hair)" transform="rotate(-18 242 268)"/>
        <ellipse cx="242" cy="270" rx="22" ry="24" fill="#d9a3a6" opacity=".7" transform="rotate(-18 242 270)"/>
        <ellipse cx="398" cy="268" rx="43" ry="45" fill="url(#b-hair)" transform="rotate(18 398 268)"/>
        <ellipse cx="398" cy="270" rx="22" ry="24" fill="#d9a3a6" opacity=".7" transform="rotate(18 398 270)"/>
        <!-- body -->
        <path d="M148 800 C158 690 200 640 260 618 L380 618 C440 640 482 690 492 800 Z" fill="url(#b-skin)"/>
        <path d="M290 534 L350 534 L360 620 L280 620 Z" fill="url(#b-skin)"/>
        <path d="M290 534 L350 534 L352 566 C338 574 302 574 288 566 Z" fill="#e4c8bf" opacity=".5"/>
        <path d="M118 800 C124 706 168 646 238 622 C266 646 282 676 320 700
                 C358 676 374 646 402 622 C472 646 516 706 522 800 Z" fill="url(#b-dress)"/>
        <path d="M238 622 C266 646 282 676 320 700 C358 676 374 646 402 622"
              fill="none" stroke="#c9d6d2" stroke-opacity=".4" stroke-width="2.5"/>
        <path d="M250 620 C258 592 274 572 292 560" fill="none" stroke="#0a261b" stroke-width="15" stroke-linecap="round"/>
        <path d="M390 620 C382 592 366 572 348 560" fill="none" stroke="#0a261b" stroke-width="15" stroke-linecap="round"/>
        <!-- head -->
        <path d="M220 398 C220 316 262 276 320 276 C378 276 420 316 420 398
                 C420 462 392 514 354 532 C338 540 302 540 286 532 C248 514 220 462 220 398 Z" fill="url(#b-skin)"/>
        <!-- face -->
        <path d="M246 376 Q274 370 302 386" fill="none" stroke="#b8a996" stroke-width="4" stroke-linecap="round"/>
        <path d="M338 386 Q366 370 394 376" fill="none" stroke="#b8a996" stroke-width="4" stroke-linecap="round"/>
        <path d="M248 412 Q274 392 300 412 Q274 426 248 412 Z" fill="#f6f2ea"/>
        <circle cx="274" cy="410" r="11" fill="#7e98a4"/>
        <circle cx="274" cy="410" r="5.5" fill="#1d262a"/>
        <circle cx="277" cy="406" r="2.6" fill="#ffffff" opacity=".9"/>
        <path d="M246 410 Q274 388 302 410 L311 405" fill="none" stroke="#2a2422" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M340 412 Q366 392 392 412 Q366 426 340 412 Z" fill="#f6f2ea"/>
        <circle cx="366" cy="410" r="11" fill="#7e98a4"/>
        <circle cx="366" cy="410" r="5.5" fill="#1d262a"/>
        <circle cx="369" cy="406" r="2.6" fill="#ffffff" opacity=".9"/>
        <path d="M338 410 Q366 388 394 410 L385 405" fill="none" stroke="#2a2422" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M318 446 Q323 456 315 461" fill="none" stroke="#d0a69c" stroke-width="3" stroke-linecap="round"/>
        <path d="M292 488 Q318 498 342 488 Q350 484 357 477" fill="none" stroke="#a85f68" stroke-width="4" stroke-linecap="round"/>
        <!-- hair front -->
        <path d="M214 386 C208 300 252 248 320 248 C388 248 432 300 426 386
                 C414 344 390 318 360 310 C340 342 300 352 268 340
                 C246 332 232 352 226 380 Z" fill="url(#b-hair)"/>
        <path d="M226 360 C210 420 212 470 226 512 C236 472 240 430 246 400 Z" fill="url(#b-hair)"/>
        <path d="M414 360 C430 420 428 470 414 512 C404 472 400 430 394 400 Z" fill="url(#b-hair)"/>
        <path d="M232 398 C216 500 212 600 224 684 C238 640 244 540 256 470 Z" fill="url(#b-hair)"/>
        <path d="M408 398 C424 500 428 600 416 684 C402 640 396 540 384 470 Z" fill="url(#b-hair)"/>
        <!-- choker -->
        <rect x="272" y="548" width="96" height="20" rx="10" fill="#141414"/>
        <rect x="277" y="552" width="86" height="12" rx="6" fill="none" stroke="#9aa7a8" stroke-width="1.6"/>
        <circle cx="320" cy="558" r="7" fill="#cfd6d4"/>
        <circle cx="320" cy="558" r="3" fill="#2f6b4e"/>
      </g>
    </g>
    <circle cx="1030" cy="200" r="168" fill="none" stroke="url(#b-silver)" stroke-width="2.5"/>
    <text x="1030" y="392" text-anchor="middle" fill="#9fb6ad" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="4">DRACO MALFOY · HAMSTER</text>
  </g>
</svg>
