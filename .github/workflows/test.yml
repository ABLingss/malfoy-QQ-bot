name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: koishi/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix koishi --ignore-scripts

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Validate JSON
        run: |
          for f in $(git ls-files '*.json' | grep -vE '(^|/)tsconfig[^/]*\.json$'); do
            jq -e . "$f" >/dev/null
          done

      - name: Validate SVG
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob('assets/**/*.svg', recursive=True)
          for path in files:
              ET.parse(path)
          print(f'validated {len(files)} SVG files')
          PY

      - name: Leak scan
        run: bash scripts/check-leaks.sh
